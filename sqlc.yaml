version: "2"
sql:
  - engine: "postgresql"
    # An EXPLICIT LIST, generated by scripts/gen-sqlc-schema-list.sh, not the bare
    # directory. `sqlc generate` replays a directory in lexicographic order, which puts
    # every 3-digit migration (100..106) before the 2-digit ones (10..99) -- so migration
    # 106's ALTER on `tag_categories` ran before migration 10 created it, and codegen
    # failed with "relation tag_categories does not exist".
    #
    # golang-migrate, the applier that actually matters, sorts NUMERICALLY and was never
    # wrong; this is purely a codegen problem. Renaming 106 to sort last would collide
    # with the already-applied 106 on live databases, and a DO guard does not help because
    # sqlc PARSES the schema rather than executing plpgsql.
    #
    # The list is GENERATED, not hand-maintained: a stale hand-written list fails as a
    # confusing codegen error rather than an obvious one, and adding a migration would
    # need a second edit nobody remembers.
