# Shareable user lists over GraphQL (SPEC §28, growth item 28).
#
# THE TYPE THAT HAS NO VISIBILITY ENUM, and that absence is the design.
#
# A list is private until its owner publishes it. Not "private by default with a
# visibility field" -- there is no `visibility` field here to get wrong, and that is the
# point: every alternative encoding of this rule is a second source of truth that can
# disagree with the first. The schema exposes `publishedAt`, and `publishedAt` is the
# whole of it.
#
# Concretely, a client cannot ask for private lists through `publishedLists` because the
# query does not take a visibility argument. There is nothing to forget to pass, and no
# path from this file that lists another user's drafts.
#
# AND A SEPARATE, SECOND RULE THAT IS NOT VISIBILITY: the WRITE SET (slice 8e). A list has one
# owner and a named set of collaborators who may change its CONTENTS. Seeing and writing are
# different questions asked of different people -- a collaborator may write a draft they cannot
# publish, and the readers of a published list may read it and write nothing. So the write set is
# not a visibility tier and is not modelled as one.

"""
A user's named, ordered set of archive entities.

Private until `publishedAt` is set. There is no visibility field to contradict it.
"""
type List {
  id: ID!

  "The list's name. Unique per owner, not globally."
  name: String!

  "Optional description. Null when none was given, which is distinct from an empty string."
  description: String

  "Who owns it. Their display name is denormalised onto the list for the browse listing."
  owner: User!

  """
  When it was published, or null while it is private.

  This one nullable field IS the privacy model. It is read on every list view and is the
  only thing standing between a draft and the public, so it is deliberately not derived
  from anything -- there is no boolean that could disagree with it.
  """
  publishedAt: DateTime

  "Who published it. Non-null whenever `publishedAt` is; the schema forbids the rest."
  publishedBy: User

  "Its contents in display order."
  items(perPage: Int = 50, page: Int = 1): [ListItem!]! @hasRole(role: READ)

  "How many entries it holds."
  itemCount: Int! @hasRole(role: READ)

  """
  Its publication history, newest first.

  Readable by anyone who can see the list, and that includes a draft's owner seeing why
  it is not public. Empty is normal: a list that has never been published has no history.
  """
  auditTrail: [ListAudit!]! @hasRole(role: READ)

  createdAt: DateTime!
  updatedAt: DateTime!

  """
  The list this one was forked from, or null.

  A FORK IS A COPY THAT REMEMBERS WHERE IT CAME FROM AND TRACKS NOTHING: later changes to the
  source do not reach it. The alternative -- a list that follows somebody else's -- is the
  auto-updating list, a different feature.
  """
  forkedFromId: ID

  """
  Whether this list's entries come from a saved search rather than from rows.

  A derived list stores no entries: its membership is computed from the search on every read, so a
  matching scene appears in it without anything being written. A DERIVED LIST'S ENTRIES CANNOT BE
  EDITED -- `listAddItem`, `listRemoveItem` and `listReorderItem` all refuse -- because the next read
  recomputes them, and a write that appeared to work and then vanished is the worst of the possible
  answers.
  """
  isDerived: Boolean!

  """
  The saved search this list follows, or null.

  OWNER ONLY, always: null for everybody else INCLUDING the readers of a published derived list. A
  derived list's results are what its owner chose to publish; the criteria that produced them are not
  part of that, and a viewer who could read the search would learn the owner's filters -- including the
  ones that depend on who is asking, which are the owner's own history.

  Also null on an ordinary list, and null for a derived list with no source, which is every list that
  has been un-followed.
  """
  sourceSavedSearch: SavedSearch

  """
  Who may change this list's CONTENTS, besides its owner.

  THE OWNER IS NOT IN THIS LIST. `owner` above is the owner; this field is the set of OTHER members
  who may add, remove and reorder entries. An owner who appears here would be a second answer to a
  question `owner` already answers.

  WHAT MEMBERSHIP DOES AND DOES NOT BUY: a collaborator may change the entries and nothing else --
  not renaming, not re-describing, not deleting, not publishing, not un-publishing, not changing what
  the list follows, and not adding or removing collaborators. They may remove THEMSELVES, which is
  why leaving a shared list never needs the owner's cooperation.

  READABLE BY THE OWNER AND BY THE COLLABORATORS, and by nobody else -- not even a reader of the
  published list, for whom this field is an error rather than an empty list. Who works on a list
  together is a relationship between members; publishing a list publishes its contents, not its
  authors' associations. An empty list would be a different statement ("nobody collaborates here"),
  which is why the refusal is not one.
  """
  collaborators: [User!]!

  """
  Whether the person asking is allowed to write this list's contents.

  THE ANSWER TO A QUESTION THE CLIENT WOULD OTHERWISE GUESS. A client can compare `owner.id` with its
  own id, and that is the only half of the rule it can compute: membership of `collaborators` is
  readable by exactly the people this field is for, so a client cannot decide for itself. It is not
  merely a convenience -- without it a UI either hides the controls from a collaborator who may write,
  or offers them to a reader who may not.
  """
  canEdit: Boolean!
}

"""
One entry in a list.

`position` is client-supplied and ties are common, so the display order is
`position` then id. A client that reorders should expect gaps and ties to persist.
"""
type ListItem {
  id: ID!

  "The list this belongs to."
  list: List! @hasRole(role: READ)

  "What kind of entity. A closed set, so a client can resolve it."
  entityType: ListEntityTypeEnum!

  "The entity's id, within `entityType`."
  entityId: ID!

  "Display order. Lower sorts first; ties break by id."
  position: Int!

  createdAt: DateTime!
}

"""
One recorded act on a list.

The actor is NULL when the user has since been deleted -- deliberately. Deleting a user
must not erase what they did, which is the one thing an audit record may not lose, so the
row survives with a null actor instead of cascading away with the user.
"""
type ListAudit {
  id: ID!

  "Who did it, or null if that account no longer exists."
  actor: User

  "What they did."
  action: ListAuditActionEnum!

  createdAt: DateTime!
}

enum ListEntityTypeEnum {
  PERFORMER
  SCENE
  STUDIO
  SITE
  CONTENT_ITEM
}

enum ListAuditActionEnum {
  "Made the list public."
  PUBLISH
  "Returned the list to private."
  UNPUBLISH
  """
  Added an entry.

  The three entry verbs are recorded because a list can have more than one writer: with the actor,
  they are the only record of who put something in a list, since an entry itself carries no author.
  """
  ADD_ITEM
  "Removed an entry."
  REMOVE_ITEM
  "Moved an entry to a new position."
  REORDER_ITEM
  """
  Added a member to the write set.

  The two collaborator verbs are the most trust-sensitive acts on a collaborative list, and the ones a
  moderation question is really about: who could write the list, and when did that change.
  """
  COLLABORATOR_ADD
  "Removed a member from the write set, including a member removing themselves."
  COLLABORATOR_REMOVE
}

"""
A page of published lists.

The count is on the object rather than a sibling field so it cannot be requested against a
different page than the rows it describes -- `publishedLists(page: 2)` and a separately
queried total is a shape where the two disagree and nothing catches it.
"""
type ListBrowseResult {
  "The published lists on this page, newest publication first."
  lists: [List!]!

  "Total published lists, across all pages."
  count: Int!
}

input ListCreateInput {
  "1-200 characters once trimmed. A list of only spaces is not a name."
  name: String!

  "Optional. An empty string is treated as absent."
  description: String
}

input ListUpdateInput {
  "The list to change."
  id: ID!

  name: String!
  description: String
}

input ListItemInput {
  "The list to add to."
  listId: ID!

  "What to add."
  entityType: ListEntityTypeEnum!

  entityId: ID!

  """
  Where to place it. Omit, or pass 0, to append.

  Negative is rejected rather than sorted to the front: "add" must not silently mean
  "insert at the beginning".
  """
  position: Int
}

extend type Query {
  """
  A published list, or null.

  Returns null for a draft that is not yours, INCLUDING when it does not exist -- the same
  answer, on purpose. Distinguishing the two would let a caller probe a range of ids to
  discover which private lists are real.
  """
  list(id: ID!): List @hasRole(role: READ)

  """
  Published lists, newest publication first.

  There is no argument for including drafts, because this query cannot return one. An
  owner's own drafts are reached through `lists`, which reads them by owner.
  """
  publishedLists(perPage: Int = 25, page: Int = 1): ListBrowseResult! @hasRole(role: READ)

  """
  Every list belonging to a user, drafts included.

  `me` reads your own; naming another user reads theirs, which is why this is a query
  about the ARCHIVE's users rather than about the session. If that reads wrong to you it
  should: knowing someone's private list count is not something to hand out by default.
  """
  lists(userId: ID, perPage: Int = 50, page: Int = 1): [List!]! @hasRole(role: READ)
}

extend type Mutation {
  """
  Create a list, always private.

  There is no `publish: true` argument and adding one would be the wrong fix. Publishing
  is a separate audited act (SPEC §28), and a create that could publish would let a client
  skip the audit trail entirely.
  """
  listCreate(input: ListCreateInput!): List! @hasRole(role: READ)

  """
  Rename or re-describe a list.

  Requires MODIFY on the owner. Publishing is NOT reachable here: this is a content edit,
  and `listPublish` is the audited one.
  """
  listUpdate(input: ListUpdateInput!): List! @hasRole(role: MODIFY)

  """
  Delete a list, its entries, and its audit trail.

  The audit trail goes with the list, unlike an audit trail tied to a user: the history
  describes this list, and once the list is gone it is describing nothing.
  """
  listDelete(id: ID!): Boolean! @hasRole(role: MODIFY)

  """
  Make a list public, recording who and when.

  Errors if it is already published rather than succeeding quietly. A client that
  republishes by mistake should hear about it, not receive the existing row and believe it
  had just published something.
  """
  listPublish(id: ID!): List! @hasRole(role: MODIFY)

  """
  Return a list to private.

  The audit trail is KEPT: "this was public and then withdrawn" is the fact worth keeping,
  and it is the one a moderation system needs to see.
  """
  listUnpublish(id: ID!): List! @hasRole(role: MODIFY)

  """
  Add an entry. Fails if that entity is already in the list.

  A WRITER may do this: the list's owner, or a collaborator. AUDITED with the actor, which is what a
  list with several writers has to have -- an entry carries no author of its own.

  Not silently ignored, because a double-submitting client would otherwise see a success
  and a list whose length disagrees with its contents.
  """
  listAddItem(input: ListItemInput!): ListItem! @hasRole(role: MODIFY)

  """
  Remove one entry.

  A WRITER may do this: the list's owner, or a collaborator. AUDITED with the actor, so a list with
  several writers can answer who removed something -- entries carry no author of their own.
  """
  listRemoveItem(id: ID!): Boolean! @hasRole(role: MODIFY)

  """
  Move one entry to a new position.

  A WRITER may do this: the list's owner, or a collaborator. Reordering a public list is a content
  edit, and content edits of public artefacts are the same trust-sensitive act as publishing them --
  which is a question about who the writer set is, not about how many people it holds. AUDITED with
  the actor.
  """
  listReorderItem(id: ID!, position: Int!): ListItem! @hasRole(role: MODIFY)
}

input ListCollaboratorInput {
  "The list whose write set changes."
  listId: ID!

  """
  The member to add or remove.

  Adding the list's OWNER is refused: the owner is not a collaborator, and a second row saying so
  could then be removed, leaving a list whose owner is in the set on one read and not the next.
  """
  userId: ID!
}

extend type Mutation {
  """
  Add a member to a list's write set. OWNER ONLY -- and that is half the feature.

  A collaborator may change the list's CONTENTS and may not change who else may: a write set that grows
  without its owner knowing is the thing this design exists to avoid. Refused when the member is
  already in the set, when the member does not exist, when the target is the owner, and when the list
  is DERIVED (a list whose contents are computed has nothing for a collaborator to write).
  """
  listAddCollaborator(input: ListCollaboratorInput!): Boolean! @hasRole(role: MODIFY)

  """
  Remove a member from a list's write set.

  TWO callers may do this: the OWNER, who may remove anybody, and the MEMBER THEMSELVES. Leaving a
  shared list should not require asking the person who invited you, and a member who could not remove
  themselves would have to request it. Removing a member does NOT remove what they added -- entries
  carry no author, so nothing is taken away with them -- which is exactly why the audit trail records
  the actor.

  Refused when the member is not in the set, rather than succeeding quietly: "removed" twice describes
  one change, and a UI showing both would be reporting an act that did not happen.
  """
  listRemoveCollaborator(input: ListCollaboratorInput!): Boolean! @hasRole(role: MODIFY)
}

input ListForkInput {
  "The list to copy. You must be able to SEE it: its own visibility rule decides."
  id: ID!

  "The new list's name, unique per owner like any other."
  name: String!
}

extend type Mutation {
  """
  Copy a list into one owned by the caller.

  The fork starts PRIVATE and UNPUBLISHED -- the source owner's publication is their decision,
  not something a copy inherits -- and it inherits the source's description when none is given.
  Its entries are copied in their existing order, and neither list changes the other afterwards.
  """
  listFork(input: ListForkInput!): List! @hasRole(role: READ)
}

input ListSourceSearchInput {
  listId: ID!

  "The saved search to follow. It must be YOUR OWN: a list cannot publish somebody else's criteria."
  savedSearchId: ID!
}

extend type Mutation {
  """
  Make a list follow a saved search.

  The list must be empty of entries of its own -- becoming derived would discard them -- and it must
  already be the caller's. Switching a derived list from one search to another is allowed, because
  nothing is discarded when nothing is stored.
  """
  listSetSourceSearch(input: ListSourceSearchInput!): List! @hasRole(role: MODIFY)

  """
  Stop following a saved search.

  The list becomes an ordinary EMPTY list. Its former entries are NOT copied into it: stopping is what
  the caller asked for, and materialising a snapshot they did not ask for would leave them unable to
  tell which of their lists track anything.
  """
  listClearSourceSearch(listId: ID!): List! @hasRole(role: MODIFY)
}
