directive @isUserOwner on FIELD_DEFINITION
directive @hasRole(role: RoleEnum!) on FIELD_DEFINITION

enum RoleEnum {
  READ
  VOTE
  EDIT
  MODIFY
  MODERATE
  ADMIN
  """May generate invites without tokens"""
  INVITE
  """May grant and rescind invite tokens and resind invite keys"""
  MANAGE_INVITES
  BOT
  READ_ONLY
  EDIT_TAGS
}

type InviteKey {
  id: ID!
  uses: Int
  expires: Time
  """
  The link this key is shared as (§11, phase 11 slice 11c). The same string the QR encodes and the
  same one the router serves: a link that disagreed with its own QR code would be a QR code that
  sends somebody somewhere else.
  """
  link: String!
  """
  The link, rendered as a QR code, as an SVG document.

  A text document and not an image, deliberately: it needs no image pipeline, it can be inlined into
  a page, and it is the member's own key (this field is only ever reached through `invite_codes`,
  which is owner-only) so nobody else's invitation is drawn here.
  """
  qr_svg: String!
}

type User {
  id: ID!
  name: String!
  """Should not be visible to other users"""
  roles: [RoleEnum!] @isUserOwner
  """Should not be visible to other users"""
  email: String @isUserOwner
  """Should not be visible to other users"""
  api_key: String @isUserOwner
  notification_subscriptions: [NotificationEnum!]! @isUserOwner
  """Preferred order of types within their group, when ranking images. Empty means no preference."""
  image_type_preferences: [ImageTypeEnum!]! @isUserOwner
  """Preferred order of the groups themselves, deciding which dimension is compared first. Empty means the instance order."""
  image_type_group_preferences: [ImageTypeGroupEnum!]! @isUserOwner

  """ Vote counts by type """
  vote_count: UserVoteCount!
  """ Edit counts by status """
  edit_count: UserEditCount!

  """Calls to the API from this user over a configurable time period"""
  api_calls: Int! @isUserOwner
  invited_by: User @isUserOwner
  invite_tokens: Int @isUserOwner
  active_invite_codes: [String!] @isUserOwner @deprecated(reason: "Use invite_codes instead")
  invite_codes: [InviteKey!] @isUserOwner

  """
  What this member may do with invitations, and why (SPEC §7, plan phase 11
  slice 11a).

  Owner only, like the fields above: how many invitations a member may issue is
  part of their standing, and standing is not other members' business.

  Everything here is DERIVED per request from the same two facts the mutation
  decides on -- the level (from internal/service/trust) and the usable key rows
  -- so this can never show an allowance that disagrees with the refusal the
  member would get by trying.
  """
  invite_allowance: InviteAllowance @isUserOwner

  """
  What this member's invitations have DONE (SPEC §11, plan phase 11 slice 11c).

  Owner only, like the allowance above and for the same reason: what a member's invitations
  produced is part of their standing, and it is nobody else's business.

  Everything here is DERIVED from event rows, never from a counter column, which is what makes
  the three numbers able to disagree with each other honestly: "4 looked, 1 gave an address,
  nobody joined" and "1 looked and joined" are the same total and completely different news.
  DELIBERATELY NOT a `remaining`/`rate` field: converting an invite funnel into one number is a
  rendering decision, and the instance is the wrong place to make it.
  """
  invite_stats: InviteStats @isUserOwner

  """
  Trust level and contribution totals (SPEC section 6).

  Owner and admin only: trust is a reputation score, and a user's standing is
  not other users' business. Unlike `roles`, this is NOT an authorization
  primitive -- it records what the user has done, not what they may do.
  """
  trust: UserTrust @isUserOwner

  """
  This user's trust LEVEL, and nothing else (SPEC §5.2, plan phase 6).

  THE DECISION THIS FIELD IS: level public, counters private.

  The draft made the whole sub-score set public; `trust` above says a user's
  standing is not other users' business. Both are right about different things.
  A level is what a member's peers already see in what they contribute, and what
  a client needs to render a badge or decide whether to show a quest's worth --
  while approved and rejected edits together are an ERROR RATE, which is a
  performance review rather than a badge. The curve's weights are private too:
  publishing the thresholds turns "earn trust" into "clear a bar", and the bar is
  the one thing an operator must be able to move without a negotiation.

  Deliberately NOT the owner-gated `trust` object with its directive removed:
  that object carries the counters, so publishing it to ask "is the level
  visible?" would publish the rejection count with it. A separate field is the
  only shape in which this rule can hold.
  """
  trust_level: Int!
}

"""
A member's invite allowance: the two facts it is made of, and the decision they
lead to.

`cap` is the number of keys the member's LEVEL lets them hold usable at once
(0 at the level every account starts at), `active_keys` is how many they hold
right now, counted from the key rows rather than from a stored tally -- which is
what makes an expired or consumed key free its slot with nothing to clean up.
`tokens` is what an operator has granted, and a grant buys a key only when no
level slot is free.

There is deliberately no "remaining" field: 0 free slots means something
different to a member at their cap, to a member whose level grants none at all,
and to an exempt member who is not limited by the cap -- one integer meaning
three things is a rendering bug waiting to happen. `can_generate` is the answer
to the only question a client actually asks.
"""
type InviteAllowance {
  """The trust level the allowance comes from."""
  level: Int!
  """How many invite keys that level may hold usable at once."""
  cap: Int!
  """How many are in use right now."""
  active_keys: Int!
  """Invite tokens an operator has granted."""
  tokens: Int!
  """True when the member's role is the operator's delegation, which no cap constrains."""
  exempt: Boolean!
  """Whether another key may be minted right now."""
  can_generate: Boolean!
}

"""
The three things an invitation can do, counted.

A scan is somebody opening the key's landing page (interest, and nobody in particular), a signup
is an address registered with the key (somebody's intent), and an activation is the account the
key produced (a person). Counted across EVERY key the member has ever minted, including keys
that no longer exist: a key whose last use is consumed is deleted, and a counter that vanished
with it would report zero for the one invitation a member actually asks about.
"""
type InviteStats {
  """Landing pages opened. Records no visitor: no address, no agent, no account."""
  scans: Int!
  """Addresses registered with a key of this member's. Not yet accounts."""
  signups: Int!
  """Accounts those signups became. This is the number that is a person."""
  activations: Int!
}

"""
A user's trust standing.

`level` is derived from the totals by the curve in internal/service/trust, and
is the field that gates capability: level 4 (Archivist) is the point at which a
user may opt in to viewing content.

`content_viewing_opt_in` is the user's own choice and is recorded
independently of level, so a user can express the preference before they are
eligible. Both conditions must hold for access -- see SPEC section 6.
"""
type UserTrust {
  level: Int!
  approved_edits: Int!
  rejected_edits: Int!
  identification_solves: Int!
  quests_completed: Int!
  replicas_hosted: Int!

  """
  How many members this member invited who reached Registered.

  A count of PEOPLE, unlike the invite allowance on User, which is a count of
  slots: this is what the member's own referrals have produced, and it is what
  the referral payment is derived from (one payment per invitee, ever).
  """
  invites_activated: Int!

  content_viewing_opt_in: Boolean!

  """
  Whether this user may currently view content: level 4 or above AND opted in.

  Derived at read time rather than stored, because eligibility changes when a
  threshold changes and a stored copy would go stale silently.
  """
  can_view_content: Boolean!
}

input UserCreateInput {
  name: String!
  """Password in plain text"""
  password: String!
  roles: [RoleEnum!]!
  email: String!
  invited_by_id: ID
}

input UserUpdateInput {
  id: ID!
  name: String
  """Password in plain text"""
  password: String
  roles: [RoleEnum!]
  email: String
}

input NewUserInput {
  email: String!
  invite_key: ID
}

input ActivateNewUserInput {
  name: String!
  activation_key: ID!
  password: String!
}

input ResetPasswordInput {
  email: String!
}

input UserChangePasswordInput {
  """Password in plain text"""
  existing_password: String
  new_password: String!
  reset_key: ID
}

input UserDestroyInput {
    id: ID!
}

input GrantInviteInput {
  user_id: ID!
  amount: Int!
}

input RevokeInviteInput {
  user_id: ID!
  amount: Int!
}

type QueryUsersResultType {
  count: Int!
  users: [User!]!
}

input RoleCriterionInput {
  value: [RoleEnum!]!
  modifier: CriterionModifier!
}

input UserQueryInput {
  """Filter to search user name - assumes like query unless quoted"""
  name: String
  """Filter to search email - assumes like query unless quoted"""
  email: String
  """Filter by roles"""
  roles: RoleCriterionInput
  """Filter by api key"""
  apiKey: String

  """Filter by successful edits"""
  successful_edits: IntCriterionInput
  """Filter by unsuccessful edits"""
  unsuccessful_edits: IntCriterionInput
  """Filter by votes on successful edits"""
  successful_votes: IntCriterionInput
  """Filter by votes on unsuccessful edits"""
  unsuccessful_votes: IntCriterionInput
  """Filter by number of API calls"""
  api_calls: IntCriterionInput
  """Filter by user that invited"""
  invited_by: ID

  page: Int! = 1
  per_page: Int! = 25
}

type UserEditCount {
  accepted: Int!
  rejected: Int!
  pending: Int!
  immediate_accepted: Int!
  immediate_rejected: Int!
  failed: Int!
  canceled: Int!
  accepted_bot: Int!
  rejected_bot: Int!
  pending_bot: Int!
  immediate_accepted_bot: Int!
  immediate_rejected_bot: Int!
  failed_bot: Int!
  canceled_bot: Int!
}

type UserVoteCount {
  abstain: Int!
  accept: Int!
  reject: Int!
  immediate_accept: Int!
  immediate_reject: Int!
}

input GenerateInviteCodeInput {
  # the number of invite keys to generate. If not set, a single invite key will be generated
  keys: Int
  # the number of uses for each invite key. If not set, the invite key will have one use
  uses: Int
  # the number of seconds until the invite code expires. If not set, the invite code will never expire
  ttl: Int
}

input UserChangeEmailInput {
  existing_email_token: ID
  new_email_token: ID
  new_email: String
}

enum UserChangeEmailStatus {
  CONFIRM_OLD
  CONFIRM_NEW
  EXPIRED
  INVALID_TOKEN
  SUCCESS
  ERROR
}
