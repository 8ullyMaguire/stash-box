"""
Where an aggregated piece of content lives, and whether it is still alive.

This is the aggregator programme's read surface (`docs/spec/feature-content-aggregator.md`,
phase 1). A scene's `urls` say which links the scene claims; a `ContentSource` adds what
this instance knows about those links -- whether anything has ever checked them, when,
and what happened.

The two are deliberately separate. A URL's HEALTH outlives the scene's claim to it: the
edit path replaces a scene's URL list by deleting every row and re-inserting the submitted
set, and the health history survives that on purpose. So `urls` is membership and
`sources` is membership plus health, and a client that wants "the links, with a warning on
the dead ones" asks for the latter.
"""
type ContentSource {
  """
  The source record's id, or null.

  Null means the scene claims this URL but no health record exists for it yet -- the
  window between a URL being added and the health sweep seeing it, and the permanent
  state of a URL that was added before this feature existed. A null id is not an error
  and not a missing row: the URL is real, its health is simply unknown, which is exactly
  what the `status` field then says.
  """
  id: ID

  "The URL. Always present, because membership is what this row exists to report."
  url: String!

  "The site this URL belongs to, when the directory knows it. Resolved in bulk, not per source."
  site: Site

  "The platform slug, when something has set one. Null is 'not recorded', never a guess from the URL."
  platform: String

  """
  The source's health: one of `UNKNOWN`, `LIVE`, `INTERMITTENT`, `DEAD`, `DMCA`, `ARCHIVED`.

  An enum now, because the rules it was waiting for exist. It was a plain string while the
  transition rules were unbuilt -- "an enum published before the rules exist freezes a
  vocabulary nobody has agreed to" -- and the change from string to enum was always going to
  break a client, which is the price of publishing a vocabulary late rather than a wrong one.

  The database's column is lowercase and these values are uppercase, because GraphQL enums
  are. The resolver maps the two EXPLICITLY rather than by upper-casing, so a status added to
  the column without a name here is an error rather than a value no client can switch on.

  `UNKNOWN` is the honest default: nothing has checked this URL yet. It is not `LIVE`.
  """
  status: ContentSourceStatus!

  """
  Whether this is the source a reader should be sent to.

  At most one per scene, enforced by a partial unique index rather than by convention.
  A scene can also have NO canonical source -- that is a legitimate state, and the state
  a scene is in until someone elects one.
  """
  canonical: Boolean!

  "When this instance first saw the URL. Null when there is no health record."
  first_seen: Time

  """
  When the health sweep last looked, or null if it never has.

  Null is "never checked" and is distinct from a check that failed -- the same
  distinction the timestamp/verification-state work had to introduce, for the same
  reason: an absent value must not read as an answer.
  """
  last_checked: Time

  """
  When this URL last responded successfully.

  Set only by a success, so it is the last date the source was known good rather than
  the last date it was looked at. That is the field a "this link has been dead since X"
  message reads, and the evidence a resurrection queue works from.
  """
  last_ok: Time

  "Consecutive failed checks. Reset by a success; the threshold that matters is phase 9's."
  check_failures: Int!

  """
  A snapshot of this URL, when one was taken.

  Null is the ordinary case: an archive that was never made is an absence, not a state.
  """
  archived_url: String
}

"""
What happened to a submitted URL, as the submitter needs to hear it.

Two outcomes and neither is a failure: `queued` means the URL is now work for the
pipeline, and `duplicate` means this instance already has it. Reporting a duplicate as an
error is how submitters learn to stop submitting, and a queue that nobody feeds is a queue
that does not work (spec §5).
"""
type IngestSubmission {
  "`queued`, `duplicate`, or `invalid` when the URL could not be parsed at all."
  status: String!

  """
  The queue row, when one was created. Absent for a duplicate: nothing was enqueued, and
  an id here would say otherwise.
  """
  queue_id: ID

  """
  What the submitted URL was reduced to -- the key dedup runs on.

  Returned because the interesting duplicate is the one where the submitter's URL LOOKS
  different from last week's: seeing `https://x.invalid/a` come back for
  `https://www.x.invalid/a/?utm_source=nl#t=30` is the difference between "the aggregator
  is broken" and "it already has this".
  """
  normalized_url: String!

  "A sentence for the submitter: the refusal reason, or that the URL is already known."
  message: String
}

extend type Mutation {
  """
  Submit a URL for aggregation: fetch it, decide whether this instance already has the
  content, and either record a source or create a record for it (spec §1).

  EDIT, because that is the act: proposing a change to the shared record. BOT may also
  submit (the crawler is a client), and a bot's submissions go through the same dedup and
  review gates as anyone else's.

  `sceneId` says which scene the URL is a source FOR, when the submission comes from a
  scene page. It outranks the pipeline's own inference: a person naming a destination is
  an instruction, and a fingerprint match is a guess (see `Known.Target`).
  """
  submitContentUrl(url: String!, sceneId: ID): IngestSubmission!
    @hasRole(role: EDIT)
}

"""
A content source's health, as the sweep records it.

The six values mirror `content_sources.status`'s CHECK constraint exactly. The mirroring is enforced
in one direction by the resolver -- a status with no name here is an error, not a value passed
through -- and in the other by the column itself, which cannot hold a value this enum does not list.
"""
enum ContentSourceStatus {
  UNKNOWN
  LIVE
  INTERMITTENT
  DEAD
  DMCA
  ARCHIVED
}

extend type Scene {
  """
  A live URL for the same content on ANOTHER scene, or null.

  Null is the ordinary case and means one of three things, all of which are answers: this scene has a
  live source of its own, or it has none anywhere (nothing is known to be serving it), or its source
  was taken down -- in which case no mirror is offered ON PURPOSE, because a takedown is a decision
  rather than a hosting problem, and routing around one through a fingerprint cluster would be
  circumventing it by accident.

  The match is by PHASH cluster, so this is a claim that the other scene is the SAME content, not
  merely a similar one; the distance the server uses is deliberately tight for that reason.
  """
  mirror: ContentSource
}

"""
Something this instance refuses to point at: a URL a notice named, or a whole host (migration 134).

It is the CURRENT policy, not a history. Releasing a block deletes the row, and the record of the
block and the release lives in `mod_audit` -- so this list is what an instance refuses RIGHT NOW, and
there is no "released" flag for a reader to forget to filter on.

ADMIN only, and the reason is not secrecy: the list is a set of decisions about who may be pointed
at, and it is the operator's instrument. A member asking "why can I not add this URL" is answered by
the submission's own refusal reason, not by this list.
"""
type ContentSourceBlock {
  id: ID!

  "`url` for a single URL, `host` for everything on a host."
  kind: String!

  """
  The key: a normalized URL, or a host.

  Both are in the same spelling the pipeline computes before it records anything (pkg/urlkey), which
  is the property that makes a block work: a block whose value did not match what the pipeline sees
  would be stored, listed, and silently refuse nothing.
  """
  value: String!

  """
  Why, in the words of whoever asked for it: the notice's reference, the report's id, or the
  operator's own reason. Required at the mutation, because an audit trail that says only "removed"
  cannot answer the one question anyone asks of it.
  """
  reason: String!

  "Who decided. Null for a row whose author was deleted, and for one migrated in by hand."
  created_by: User

  created_at: Time!
}

"""
What a takedown did, which is the operator's next question after asking for one.

`sources` is empty in a normal and important case: a notice about a URL this instance has never
recorded. Nothing was serving it, and the block is now what stops it arriving -- so an operator who
read an empty list as a failure would remove the only protection the notice produced.
"""
type ContentTakedownResult {
  "The key this instance now refuses."
  block: ContentSourceBlock!

  "How many source records the decision moved to the terminal status."
  changed: Int!

  "Those records, as they were before the status changed. Empty is normal; see above."
  sources: [ContentSource!]!

  """
  Whether this instance was already refusing the key before this call.

  A second notice is not an error: complaints repeat, and they name URLs an operator already
  removed. So the same call twice is a success twice, with `changed: 0` and this true the second
  time -- which is what tells an operator "this was handled" rather than sending them to escalate
  something that is already done.
  """
  already_blocked: Boolean!
}

input TakedownContentURLInput {
  """
  The URL the notice names, as the notice writes it. Normalized server-side with the same function
  the pipeline keys submissions by, so a notice's URL and a submission's URL are compared as one
  value rather than as two strings that look alike.
  """
  url: String!

  """
  What prompted this: a notice id, an email reference, a case number, or the operator's own reason.
  Required. It is what the audit row records, and it is the field an instance answers a complaint
  with six months later.
  """
  reference: String!
}

input BlockContentHostInput {
  "A host, or any URL on it -- both are accepted and reduced to the host."
  host: String!

  "Why the whole host, rather than a URL. Required, for the same reason `reference` is."
  reason: String!
}

extend type Mutation {
  """
  Take down every record of a URL and refuse the URL from now on (migration 134).

  ADMIN, because this is the instance's response to a legal notice and not a moderation action.

  Two effects, both intended and both in one transaction: the records stop being served, and the URL
  cannot be recorded again -- even though it may never have been recorded in the first place. The
  audit row written alongside them is the record of who decided and on what.
  """
  takedownContentUrl(input: TakedownContentURLInput!): ContentTakedownResult!
    @hasRole(role: ADMIN)

  """
  Refuse a whole host and take down every source on it.

  The instrument for the report that names a site rather than a URL: a single takedown URL would
  leave the same work re-uploaded under a different path live tomorrow. Every host already recorded
  is moved to the terminal status in the same transaction.
  """
  blockContentHost(input: BlockContentHostInput!): ContentTakedownResult!
    @hasRole(role: ADMIN)

  """
  Stop refusing a key. Reports whether there was a block to release.

  Releasing does NOT restore the sources a block took down. They stay down until something
  re-submits them: a release usually means the block was too broad or the material moved, not that
  the complaint was withdrawn, and un-removing content on the strength of it would assert the
  opposite.
  """
  releaseContentBlock(kind: String!, value: String!): Boolean!
    @hasRole(role: ADMIN)
}

extend type Query {
  "Every key this instance currently refuses, newest first. ADMIN only."
  contentSourceBlocks(limit: Int = 100, offset: Int = 0): [ContentSourceBlock!]!
    @hasRole(role: ADMIN)
}
