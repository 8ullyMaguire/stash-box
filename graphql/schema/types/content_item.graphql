"""
A content item: one of the five content kinds that are not video (aggregator phase 3).

Video is still a `Scene`, here and everywhere else: the split is by what the content
IS, not by when it arrived, because every existing client, every fingerprint and the
whole collage machinery are scene-shaped, and the programme's no-loss rule is binding.
"""
type ContentItem {
  id: ID!
  kind: ContentItemKind!

  "What the item is called. Non-blank by the table's own CHECK."
  title: String!

  "Free text about the item."
  details: String

  "When it was released, if that is known. Nullable: undated items are normal here."
  releaseDate: Date

  createdAt: Time!

  """
  How complete this item is.

  Reads the database on demand rather than being stored, so it is correct the moment
  an edit lands rather than whenever something remembered to refresh it. The weights
  are the content item's own (see internal/service/completion/score.go): tags and
  media dominate, because an item nobody can find and nothing can fetch is the failure
  the discovery surfaces exist to prevent.
  """
  completion: Completion

  """
  The item's chapters, in reading order.

  Empty for kinds that have no chapters; a text item with chapters is a serial, a comic
  item's chapters are chapters, an animation's are episodes.
  """
  chapters: [ContentItemChapter!]!

  """
  The item's URLs, the item itself first and its renditions after it.

  Empty until phase 10 fills the storage plane, and empty is a real answer: an item with
  no URL has been catalogued and not yet fetched.
  """
  media: [ContentItemMedia!]!
}

type ContentItemChapter {
  id: ID!

  "Position in the item, ascending from 1. Unique per item."
  number: Int!

  "What the chapter is called, if it has a name."
  title: String

  "How many pages, for a comic. Null for kinds that count seconds instead."
  pageCount: Int

  "How long, for an episode. Null for kinds that count pages instead."
  durationSeconds: Int
}

type ContentItemMedia {
  id: ID!

  "Where it can be fetched from."
  url: String!

  "What the URL is: the item itself, or a rendition of it."
  kind: ContentItemMediaKind!

  width: Int
  height: Int
  durationSeconds: Int
}

"""
What a media URL is.

A closed set, enforced by the column's CHECK as well: `original` is the item itself and
the rest are derived or alternate renditions, so a client that wants "the thing" and not
"a version of the thing" has a member to ask for.
"""
enum ContentItemMediaKind {
  original
  preview
  stream
  download
  archive
}

"""
Which of the six kinds an item is.

Closed, and enforced by the table's CHECK as well: an unknown kind would be a row
nothing can render, nothing can filter on, and nothing counts.
"""
enum ContentItemKind {
  image
  gallery
  animation
  text
  audio
  comic
}

extend type Query {
  """
  Read one content item.

  Null for a missing or soft-deleted item rather than an error: following a stale link
  is a normal outcome, and every client already renders an empty state for a null.
  """
  contentItem(id: ID!): ContentItem @hasRole(role: READ)

  """
  The newest content items, optionally of one kind.

  Ordered by creation, not by release date. A bounded pool ordered by a NULLABLE field
  silently omits every row that lacks it -- the defect phase 7 slice 6 recorded -- and
  undated items are normal here.

  A limit above 100 is refused rather than clamped, so a caller never receives a
  truncated list that looks complete.
  """
  queryContentItems(kind: ContentItemKind, limit: Int): [ContentItem!]!
    @hasRole(role: READ)
}

"""
A proposed change to a content item.

Field-level like every other edit type: a null field means "leave it alone". The service
turns the pair (what the client sent, what the row holds) into an old/new diff before the
edit is stored, so a client cannot express "clear this field" by sending null -- the same
trade every other type here makes.
"""
input ContentItemEditDetailsInput {
  "Which of the six kinds. Required for create."
  kind: ContentItemKind

  "What the item is called. Non-blank: the table's CHECK refuses a blank one."
  title: String

  details: String

  "When it was released, as YYYY-MM-DD. Validated at submit, not left to the DATE column."
  release_date: String
}

input ContentItemEditInput {
  edit: EditInput!

  "Not required for destroy type"
  details: ContentItemEditDetailsInput
}

type ContentItemEdit {
  edit_id: ID!
  kind: ContentItemKind
  title: String
  details: String
  release_date: String
}
