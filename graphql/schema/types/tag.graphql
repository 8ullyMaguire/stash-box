enum TagGroupEnum {
  PEOPLE
  SCENE
  ACTION
}

type Tag {
  "How far this tag raises its entities out of a viewer's default view, 0-3. A tier can only remove visibility."
  content_tier: Int!

  "Refuse this tag's entities to a viewer who has not opted into content viewing, whatever the tier."
  requires_opt_in: Boolean!
  id: ID!
  name: String!
  description: String
  aliases: [String!]!
  deleted: Boolean!
  edits: [Edit!]!
  category: TagCategory
  created: Time!
  updated: Time!

  """
  Direct implications: applying this tag also applies these.

  An implication is changed only through a tag edit (`added_implications` /
  `removed_implications` on `TagEditDetailsInput`), because tag data is shared data and the
  edit system is this instance's proposal-discussion-vote machine.
  """
  implies: [Tag!]!

  "Direct: the tags that imply this one."
  implied_by: [Tag!]!

  """
  Everything below this tag, at any depth, with how far below.

  Read this instead of walking `implies` when the question is "what will a filter on this
  tag actually return": it is one round trip and it is the set the search expands to.
  """
  implies_transitive: [TagAtDepth!]!

  "Everything above this tag: every tag a reader could filter by and still find this one."
  implied_by_transitive: [TagAtDepth!]!

  """
  How many scenes a filter on this tag would return, through the implications below it.

  Not `COUNT(scene_tags)`: a scene tagged only `cowgirl_position` is found by a filter on
  `woman_on_top`, so it counts here too. That is the number a reader sees when they click the
  tag, and the two must not disagree.
  """
  scene_count: Int!
}

"""
The tags a result set is made of, most-used first (docs/spec/feature-discovery.md section 6).

Scoped by exactly the filter the results were scoped by -- the same query builder, not a copy --
so a facet cannot describe a different set of scenes than the one it sits beside.
"""
type TagFacets {
  tags: [TagFacet!]!
  """
  How many of the result scenes carry at least one tag. The denominator a client needs to render
  "40% of these" honestly.
  """
  tagged_count: Int!
}

type TagFacet {
  tag: Tag!
  """
  Result scenes carrying this tag or anything implying it: exactly what filtering by it returns.
  """
  count: Int!
  """
  `count` divided by every scene in this INSTANCE a filter on this tag would return.

  1.0 means this query's result set already holds everything that tag has. It is a display
  figure and never a filter: it is computed against this instance's corpus, so two instances
  holding different scenes give the same query different numbers.
  """
  strength: Float!
}

"""
A tag and how far it is from the tag that was asked about.

`depth` is what makes a flat list usable: without it a client cannot tell a direct
implication from one three levels down without walking the graph itself. 1 is direct.
"""
type TagAtDepth {
  tag: Tag!
  depth: Int!
}

"""
One row of the ontology, by name.
"""
type TagImplication {
  tag_id: ID!
  tag_name: String!
  implied_tag_id: ID!
  implied_name: String!
  created_at: Time!
}

"""
One version of the tag ontology, written when the graph changes.
"""
type OntologyVersion {
  version: Int!
  note: String
  created: Time!

  "The whole ontology at this version, as a JSON list of {\"tag\": ..., \"implies\": ...} pairs by name. Empty for a listing."
  snapshot: String
}

input TagCreateInput {
  name: String!
  description: String
  aliases: [String!]
  category_id: ID
}

input TagUpdateInput {
  id: ID!
  name: String
  description: String
  aliases: [String!]
  category_id: ID
}

input TagDestroyInput {
  id: ID!
}

input TagEditDetailsInput {
  name: String
  description: String
  aliases: [String!]
  category_id: ID

  """
  Tags this tag implies, added by this edit. Both lists are relative to the tag being
  edited, and both are applied when the edit is approved.

  An edit that would create a cycle is refused when it is submitted, so the submitter gets
  the reason while they can still change it; the database refuses it again on apply.
  """
  added_implications: [ID!]
  removed_implications: [ID!]
}

input TagEditInput {
  edit: EditInput!
  """Not required for destroy type"""
  details: TagEditDetailsInput
}

type TagEdit {
  name: String
  description: String
  added_aliases: [String!]
  removed_aliases: [String!]
  added_implications: [Tag!]
  removed_implications: [Tag!]
  category: TagCategory

  aliases: [String!]!
}

type QueryTagsResultType {
  count: Int!
  tags: [Tag!]!
}

type QueryTagCategoriesResultType {
  count: Int!
  tag_categories: [TagCategory!]!
}

enum TagSortEnum {
  NAME
  CREATED_AT
  UPDATED_AT
}

input TagQueryInput {
  """Filter to search name, aliases and description - assumes like query unless quoted"""
  text: String
  """Searches name and aliases - assumes like query unless quoted"""
  names: String
  """Filter to search name - assumes like query unless quoted"""
  name: String
  """Filter to category ID"""
  category_id: ID

  page: Int! = 1
  per_page: Int! = 25
  direction: SortDirectionEnum! = ASC
  sort: TagSortEnum! = NAME
}

type TagCategory {
  id: ID!
  name: String!
  group:  TagGroupEnum!
  description: String

  """
  The parent category, or null for a top-level one.

  Nullable because it is null for a top-level category AND for a category whose parent
  was deleted -- deleting a parent promotes its children rather than cascading, precisely
  so reorganising vocabulary cannot destroy it.
  """
  parent: TagCategory

  "Direct children only. One level, for a tree that loads as the user expands it."
  children: [TagCategory!]!

  """
  Everything below this category, at any depth.

  Prefer this over walking `children` client-side when you already know the whole subtree:
  it is one round trip instead of one per level.
  """
  descendants: [TagCategoryTreeNode!]!

  """
  Parents, grandparents, and so on to the root.

  Ordered NEAREST PARENT FIRST, so a breadcrumb renders by reading this in reverse.
  """
  ancestors: [TagCategoryTreeNode!]!
}

"""
A category in a tree walk, with how far from the category that was asked about.

`depth` is what makes a flat list usable: without it a client cannot tell a direct child
from a great-grandchild without reconstructing the tree itself. 0 means an immediate
child (or the immediate parent, in `ancestors`).
"""
type TagCategoryTreeNode {
  category: TagCategory!

  "0 for an immediate neighbour; 1 for the next level out; and so on."
  depth: Int!
}

input TagCategoryParentInput {
  id: ID!
  "The new parent. Null promotes this category to top level."
  parentId: ID
}

input TagCategoryCreateInput {
  name: String!
  group:  TagGroupEnum!
  description: String
}

input TagCategoryUpdateInput {
  id: ID!
  name: String
  group:  TagGroupEnum
  description: String
}

input TagCategoryDestroyInput {
  id: ID!
}

input TagContentTierInput {
  id: ID!

  "0-3. Zero means unclassified, which is also visible to everyone."
  tier: Int!

  "Independent of the tier: a tier-0 tag can still require the opt-in."
  requires_opt_in: Boolean!
}
