#import "../fragments/PerformerFragment.gql"
#import "../fragments/StudioFragment.gql"
#import "../fragments/ImageFragment.gql"
#import "../fragments/SceneFragment.gql"
#import "../fragments/TagFragment.gql"
#import "../fragments/CommentFragment.gql"
#import "../fragments/URLFragment.gql"
#import "../fragments/FingerprintFragment.gql"
fragment EditFragment on Edit {
  id
  target_type
  operation
  status
  bot
  applied
  created
  updated
  closed
  expires
  passing
  update_count
  updatable
  vote_count
  destructive
  comments {
    ...CommentFragment
  }
  votes {
    user {
      id
      name
    }
    date
    vote
  }
  user {
    id
    name
  }
  target {
    ... on Tag {
      ...TagFragment
    }
    ... on Performer {
      ...PerformerFragment
    }
    ... on Studio {
      ...StudioFragment
    }
    ... on Scene {
      ...SceneFragment
    }
    # ContentItem has been a member of the edit target union since the content
    # plane landed, and this fragment never selected anything for it. The
    # generated type for a content-item target was therefore
    # `{ __typename: "ContentItem" }` -- no id, no title -- so every consumer
    # that read `.id` off a target was reading a field the frontend had never
    # asked for. Nothing reported it, because types.ts had gone 1,841 lines
    # stale: the schema grew and the generated types were never regenerated, so
    # the union in the client still had four members and the compiler was
    # satisfied. Found by regenerating, which is `make generate-ui`.
    ... on ContentItem {
      id
    }
  }
  details {
    # ContentItemEdit is a member of the details union, and it has a `title` rather than a `name` --
    # which is exactly what utils/edit.ts's fallback was reading off it. Same root as the target arms
    # above: a union the frontend never finished, invisible while the generated types were stale.
    ... on ContentItemEdit {
      edit_id
      title
    }
    ... on TagEdit {
      name
      description
      added_aliases
      removed_aliases
      category {
        id
        name
      }
    }
    ... on PerformerEdit {
      name
      disambiguation
      added_aliases
      removed_aliases
      gender
      added_urls {
        ...URLFragment
      }
      removed_urls {
        ...URLFragment
      }
      birthdate
      deathdate
      ethnicity
      country
      eye_color
      hair_color
      height
      weight
      cup_size
      band_size
      waist_size
      hip_size
      breast_type
      genitals
      penis_length
      career_start_year
      career_end_year
      added_tattoos {
        location
        description
      }
      removed_tattoos {
        location
        description
      }
      added_piercings {
        location
        description
      }
      removed_piercings {
        location
        description
      }
      added_images {
        ...ImageFragment
      }
      removed_images {
        ...ImageFragment
      }
      draft_id
    }
    ... on StudioEdit {
      name
      added_aliases
      removed_aliases
      added_urls {
        ...URLFragment
      }
      removed_urls {
        ...URLFragment
      }
      parent {
        ...StudioFragment
      }
      added_images {
        ...ImageFragment
      }
      removed_images {
        ...ImageFragment
      }
    }
    ... on SceneEdit {
      title
      details
      added_urls {
        ...URLFragment
      }
      removed_urls {
        ...URLFragment
      }
      date
      production_date
      studio {
        ...StudioFragment
      }
      added_performers {
        performer {
          ...PerformerFragment
        }
        as
      }
      removed_performers {
        performer {
          ...PerformerFragment
        }
        as
      }
      added_tags {
        ...TagFragment
      }
      removed_tags {
        ...TagFragment
      }
      added_images {
        ...ImageFragment
      }
      removed_images {
        ...ImageFragment
      }
      added_fingerprints {
        ...FingerprintFragment
      }
      removed_fingerprints {
        ...FingerprintFragment
      }
      duration
      director
      code
      draft_id
    }
  }
  old_details {
    ... on TagEdit {
      name
      description
      category {
        id
        name
      }
    }
    ... on PerformerEdit {
      name
      disambiguation
      gender
      birthdate
      deathdate
      ethnicity
      country
      eye_color
      hair_color
      height
      weight
      cup_size
      band_size
      waist_size
      hip_size
      breast_type
      genitals
      penis_length
      career_start_year
      career_end_year
    }
    ... on StudioEdit {
      name
      parent {
        ...StudioFragment
      }
    }
    ... on SceneEdit {
      title
      details
      added_urls {
        ...URLFragment
      }
      removed_urls {
        ...URLFragment
      }
      date
      production_date
      studio {
        ...StudioFragment
      }
      added_performers {
        performer {
          ...PerformerFragment
        }
        as
      }
      removed_performers {
        performer {
          ...PerformerFragment
        }
        as
      }
      added_tags {
        ...TagFragment
      }
      removed_tags {
        ...TagFragment
      }
      added_images {
        ...ImageFragment
      }
      removed_images {
        ...ImageFragment
      }
      added_fingerprints {
        ...FingerprintFragment
      }
      removed_fingerprints {
        ...FingerprintFragment
      }
      duration
      director
      code
    }
  }
  merge_sources {
    ... on Tag {
      ...TagFragment
    }
    ... on Performer {
      ...PerformerFragment
    }
    ... on Studio {
      ...StudioFragment
    }
    ... on Scene {
      ...SceneFragment
    }
    # merge_sources is the same union as `target` above, and it kept the last of these errors alive:
    # PerformerEditUpdate and friends read `s.id` off a merge source, and the generated type for a
    # content-item source carried nothing at all.
    ... on ContentItem {
      id
    }
  }
  options {
    set_modify_aliases
    set_merge_aliases
  }
}
