fragment NotificationEditFragment on Edit {
  id
  target_type
  operation
  status
  bot
  applied
  created
  updated
  closed
  expires
  passing
  update_count
  vote_count
  destructive
  user {
    id
    name
  }
  target {
    ... on Tag {
      id
      name
    }
    ... on Performer {
      id
      name
      disambiguation
    }
    ... on Studio {
      id
      name
    }
    ... on Scene {
      id
      title
      studio {
        id
        name
      }
    }
    # Both unions in this fragment (target and merge_sources) are the same shape, and neither had a
    # ContentItem arm -- see the note in EditFragment.gql for why nothing noticed.
    ... on ContentItem {
      id
    }
  }
  merge_sources {
    ... on Tag {
      id
      name
    }
    ... on Performer {
      id
      name
      disambiguation
    }
    ... on Studio {
      id
      name
    }
    ... on Scene {
      id
      title
      studio {
        id
        name
      }
    }
    # Both unions in this fragment (target and merge_sources) are the same shape, and neither had a
    # ContentItem arm -- see the note in EditFragment.gql for why nothing noticed.
    ... on ContentItem {
      id
    }
  }
  options {
    set_merge_aliases
  }
  details {
    ... on SceneEdit {
      title
      studio {
        id
        name
      }
    }
  }
  votes {
    user {
      id
      name
    }
    date
    vote
  }
}
