server {
    listen 8011;
    server_name _;

    # Host convention (gravity 8007->8080, kindling 8009->8010, lorehaven
    # 8008->8081): nginx owns the 80xx port, the app binds a DIFFERENT internal
    # loopback port. The app binds 9998; nginx must not also listen on 9998 or
    # the bind collides with "Address already in use".
    location / {
        proxy_pass http://127.0.0.1:9998;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
