# Refer to https://gqlgen.com/config/ for detailed .gqlgen.yml documentation.

schema:
  - "graphql/schema/types/*.graphql"
  - "graphql/schema/*.graphql"
exec:
  filename: internal/models/generated_exec.go
model:
  filename: internal/models/generated_models.go

struct_tag: gqlgen

autobind:
  - "github.com/stashapp/stash-box/internal/models"

models:
  # MODELS.List IS GENERATED, and these two fields have no counterpart in the struct, so they are
  # resolved externally. `collaborators` is the write set, whose READ rule is its own (owner and
  # members only, not the readers of a published list) -- left bound, a struct field would have to be
  # filled by every code path that builds a list, including the public browse listing, which must not
  # carry it. `canEdit` is computed from the same question the service asks before a write.
  List:
    fields:
      collaborators:
        resolver: true
      canEdit:
        resolver: true
  User:
    fields:
      # `models.User` is hand-written (this repo's User is a database row, not a generated
      # type), so a schema field with no counterpart in the struct has to be resolved
      # externally. Left bound, gqlgen fails to bind it -- and the failure mode worth avoiding
      # is the other one: a field that binds to something plausible and answers with it.
      trust_level:
        resolver: true
  # A vouch's giver is a User the database row does not carry -- the row holds an id --
  # so the field is resolved externally rather than bound to a struct field that
  # would have to be filled in by hand at every construction site.
  # A board row carries a member id, not a member, so the user is resolved externally --
  # one lookup per row, bounded by the board's limit.
  LeaderboardEntry:
    fields:
      user:
        resolver: true
  Vouch:
    fields:
      voucher:
        resolver: true
  ContentItem:
    fields:
      # `chapters` and `media` are per-item lists read on demand, and this type is
      # generated FROM the schema -- so without these lines gqlgen would generate both
      # fields into the struct, the resolvers would never run, and every client would read
      # `[]`. The empty list is the trap: an item with no chapters and an item whose
      # chapters were never fetched look identical.
      chapters:
        resolver: true
      media:
        resolver: true
      # The schema generates this type, so unlike the hand-written models the field
      # WOULD be generated into the struct, and the resolver in
      # internal/api/resolver_content_item.go would never be called -- the schema
      # would answer with an unpopulated generated field, which is a silent null
      # rather than an error. Declared external on purpose.
      completion:
        resolver: true
  Scene:
    fields:
      # `mirror` is a cross-service lookup (the fingerprint cluster, then this service's own rule),
      # so there is no struct field to bind it to.
      mirror:
        resolver: true
  ContentSource:
    fields:
      # The model carries the DATABASE's string (`content_sources.status` is lower case) and the
      # schema publishes an enum. Left bound, gqlgen would hand the column's value to the enum's
      # marshaller, which answers "" for a name it does not know -- a silent empty status for every
      # source, in both directions of the mismatch. Force-resolved so the mapping is explicit,
      # testable, and an error when a status has no name.
      status:
        resolver: true
  ContentSourceBlock:
    fields:
      # The row carries an author ID and the schema publishes a User, so this is resolved
      # externally -- the same shape as LeaderboardEntry.user. Left bound, gqlgen would either fail
      # to bind the field or answer with a bare id where a client asked for a user.
      created_by:
        resolver: true
  ID:
    model: github.com/stashapp/stash-box/internal/models.ID
  IdentificationQuery:
    fields:
      # `sourceLinks` takes the image address as an argument (SPEC §8). Left
      # bound to the struct field, gqlgen parses the argument and then returns
      # the field anyway, so the address the caller passed would be discarded and
      # every link would render without it. Force-resolved for the same reason
      # SavedSearch.results is.
      sourceLinks:
        resolver: true
  SavedSearch:
    fields:
      # `results` takes paging and sorting arguments. Left bound to the struct field,
      # gqlgen parses the arguments and then returns the field anyway -- page 2 would
      # silently come back as page 1. Force-resolved so the arguments reach the query.
      results:
        resolver: true
  Collage:
    model: github.com/stashapp/stash-box/internal/models.Collage
    fields:
      # `duration`/`stale` are derived in the resolver, not stored: whether a
      # collage is stale depends on the scene's CURRENT duration, so computing it
      # once and storing it would go stale itself.
      duration:
        resolver: true
      stale:
        resolver: true
      frames:
        resolver: true
  CollageFrame:
    model: github.com/stashapp/stash-box/internal/models.CollageFrame
    fields:
      fraction:
        resolver: true
      snapshot:
        resolver: true
  Snapshot:
    model: github.com/stashapp/stash-box/internal/models.CollageSnapshot
    fields:
      timestamp:
        resolver: true
  UnderSnapshottedScene:
    model: github.com/stashapp/stash-box/internal/models.UnderSnapshottedScene
    fields:
      minimum:
        resolver: true
      scene:
        resolver: true
  FingerprintHash:
    model: github.com/stashapp/stash-box/internal/models.FingerprintHash
  Image:
    model: github.com/stashapp/stash-box/internal/models.Image
    fields:
      url:
        resolver: true
      categorized_by:
        resolver: true
  ImageType:
    # Resolved from the template loader rather than carried on the model, so a
    # file is read only when a client asks for the frame
    fields:
      crop_template:
        resolver: true
  URLInput:
    model: github.com/stashapp/stash-box/internal/models.URL
  QueryPerformersResultType:
    model: github.com/stashapp/stash-box/internal/models.PerformerQuery
  QueryEditsResultType:
    model: github.com/stashapp/stash-box/internal/models.EditQuery
  QueryScenesResultType:
    model: github.com/stashapp/stash-box/internal/models.SceneQuery
  QueryModAuditsResultType:
    model: github.com/stashapp/stash-box/internal/models.ModAuditQuery
  QueryUnorganizedImagesResultType:
    model: github.com/stashapp/stash-box/internal/models.UnorganizedImagesQuery
  UnorganizedImage:
    model: github.com/stashapp/stash-box/internal/models.UnorganizedImage
    fields:
      performer:
        resolver: true
  ClusterSceneSubmission:
    model: github.com/stashapp/stash-box/internal/models.ClusterSceneSubmission
    fields:
      scene:
        resolver: true

omit_slice_element_pointers: true
